
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Absolute Club</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #171717;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    main {
      width: 100%;
      max-width: 430px;
      min-height: calc(100svh - 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
    }

    .logo {
      width: clamp(200px, 65vw, 300px);
      height: clamp(200px, 65vw, 300px);
      border: 4px solid #e32636;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: #ffffff;
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 50%;
    }

    .logo-fallback {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
    }

    .logo-fallback span,
    h1 span {
      color: #e32636;
    }

    h1 {
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 800;
      letter-spacing: -1px;
    }

    .message {
      font-size: 14px;
      color: #777777;
    }
  </style>

  <script>
    // Automatically redirect to Telegram.
    // Change 1500 to 0 for an immediate redirect.
    window.addEventListener("load", function () {
      setTimeout(function () {
        window.location.replace(
          "https://t.me/+aB31sl_ncmk1MDU1"
        );
      }, 1500);
    });
  </script>
</head>

<body>
  <main>
    <div class="logo">
      <img
        src="./6271642495984800931.jpg"
        alt="Trader Ansh Logo"
        onerror="
          this.style.display='none';
          document.getElementById('logoFallback').style.display='block';
        "
      >

      <div
        id="logoFallback"
        class="logo-fallback"
        style="display:none"
      >
        TRADER<br><span>ANSH</span>
      </div>
    </div>

    <h1>Absolute <span>Club</span></h1>
    <p class="message">Redirecting to Telegram...</p>
  </main>
</body>
</html>
