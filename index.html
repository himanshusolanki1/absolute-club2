
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Absolute Club</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #171717;
    }

    main {
      width: 100%;
      max-width: 430px;
      min-height: calc(100svh - 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
    }

    .logo {
      width: clamp(200px, 65vw, 300px);
      height: clamp(200px, 65vw, 300px);
      border: 4px solid #e32636;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: #ffffff;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 50%;
    }

    .logo-fallback {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
    }

    .logo-fallback span,
    h1 span {
      color: #e32636;
    }

    h1 {
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 800;
      letter-spacing: -1px;
    }

    .tagline {
      font-size: 14px;
      line-height: 1.5;
      color: #777777;
    }

    .join {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 12px;
      background: #e32636;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    .join:hover {
      background: #c91d2d;
    }

    .join svg {
      width: 23px;
      height: 23px;
      flex-shrink: 0;
    }

    .note {
      font-size: 11px;
      line-height: 1.5;
      color: #888888;
    }

    @media (max-height: 650px) {
      main {
        gap: 12px;
      }

      .logo {
        width: 150px;
        height: 150px;
      }
    }
  </style>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        window.location.replace(
          "https://t.me/+aB31sl_ncmk1MDU1"
        );
      }, 150000);
    });
  </script>
</head>

<body>
  <main>
    <div class="logo">
      <img
        src="./6271642495984800931.jpg"
        alt="Trader Ansh Logo"
        onerror="
          this.style.display='none';
          document.getElementById('logoFallback').style.display='block';
        "
      >

      <div
        id="logoFallback"
        class="logo-fallback"
        style="display:none"
      >
        TRADER<br><span>ANSH</span>
      </div>
    </div>

    <h1>Absolute <span>Club</span></h1>

    <p class="tagline">
      Welcome to Absolute Club
    </p>

    <a
      class="join"
      href="https://t.me/+aB31sl_ncmk1MDU1"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" fill="currentColor"
           aria-hidden="false">
        <path d="M22 2 2.8 9.4c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 6c.2.7.1 1 .8 1 .5 0 .8-.2 1.1-.5l2.4-2.3 5 3.7c.9.5 1.5.2 1.7-.9L23 3.3c.3-1.4-.5-1.9-1-1.3ZM8.3 12.2l10-6.3c.5-.3.9-.1.5.2l-8.3 7.6-.3 3.4-1.9-4.9Z"/>
      </svg>
      Join Telegram
    </a>

    
  </main>
</body>
</html>
