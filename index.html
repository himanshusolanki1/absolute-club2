  <style>
    * {
      box-sizing: border-box;
      margin: 0;

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #171717;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    main {
      width: 100%;
      max-width: 430px;
      min-height: calc(100svh - 32px);

      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      text-align: center;
    }

    /* BIG ROUND LOGO */
    .logo {
      width: clamp(200px, 65vw, 300px);
      height: clamp(200px, 65vw, 300px);
      border: 4px solid #e32636;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: #ffffff;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 50%;
    }

    .logo-fallback {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
    }

    .logo-fallback span,
    h1 span {
      color: #e32636;
    }

    /* TITLE */
    h1 {
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.15;
    }

    .tagline {
      font-size: 14px;
      line-height: 1.5;
      color: #777777;
    }

    /* TELEGRAM BUTTON */
    .join {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 12px;
      background: #e32636;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .join:hover {
      background: #c91d2d;
    }

    .join:focus-visible {
      outline: 3px solid #171717;
      outline-offset: 4px;
    }

    .join svg {
      width: 23px;
      height: 23px;
      flex-shrink: 0;
    }

    .note {
      font-size: 11px;
      line-height: 1.5;
      color: #888888;
    }

    /* SMALL SCREENS */
    @media (max-height: 650px) {
      main {
        gap: 12px;
      }

      .logo {
        width: 150px;
        height: 150px;
      }

      .join {
        min-height: 48px;
      }
    }

    @media (max-width: 330px) {
      body {
        padding: 10px;
      }

      main {
        gap: 14px;
      }

      .logo {
        width: 180px;
        height: 180px;
      }

      h1 {
        font-size: 28px;
      }

  <!-- Automatic Telegram Redirect: 30 Seconds -->
  <script>
    (function () {
      const telegramURL = "https://t.me/+aB31sl_ncmk1MDU1";
      let redirectTimer;

      function startRedirect() {
        redirectTimer = setTimeout(function () {
          window.location.href = telegramURL;
        }, 30000000);
      }

      function cancelRedirect() {
        clearTimeout(redirectTimer);
      }

      if (document.readyState === "complete") {
        startRedirect();
      } else {
        window.addEventListener("load", startRedirect, {
          once: true
        });
      }

      // Stop automatic redirect when the visitor clicks the button.
      document.addEventListener("DOMContentLoaded", function () {
        const joinButton = document.querySelector(".join");

        if (joinButton) {
          joinButton.addEventListener("click", cancelRedirect);
        }
      });
    })();
  </script>
